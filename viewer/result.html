<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy-DaSH Result Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="common/theme.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/",
  "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.6/src/URDFLoader.js"
} }
</script>
<style>
.app { grid-template-rows: minmax(0, 1fr) auto 5px var(--gantt, 32%); }
.top { display: grid; grid-template-columns: minmax(0, 1fr) 5px var(--side, 300px); min-height: 0; }
.stats { overflow: auto; padding: 12px 14px; display: grid; gap: 14px; align-content: start; }
.scene-name { font: 600 16px/1.2 var(--font-display); margin: 0; word-break: break-all; }
.scene-meta { color: var(--muted); margin: 2px 0 0; font-size: 12.5px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.tile { background: var(--surface); padding: 8px 10px; display: grid; gap: 1px; }
.k { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tile .v { font: 500 19px/1.15 var(--font-mono); font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 11.5px; color: var(--muted); font-family: var(--font-body); }
.lbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; margin: 4px 0 6px; }
.lbar span { display: block; height: 100%; min-width: 2px; }
.lkey { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.lkey span { display: flex; justify-content: space-between; gap: 8px; }
.lkey i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.lkey b { font: 400 12px var(--font-mono); color: var(--ink); }
.transport { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface); border-top: 1px solid var(--rule); flex-wrap: wrap; }
#slider { flex: 1; min-width: 140px; accent-color: var(--accent); }
#clock { font: 13px var(--font-mono); font-variant-numeric: tabular-nums; min-width: 15ch; text-align: right; }
.gantt-pane { display: flex; flex-direction: column; }
.gantt-pane .head { flex: none; }
#gantt { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; padding: 4px 8px 0 4px; }
@media (max-width: 760px) {
  .app { display: flex; flex-direction: column; overflow: visible; }
  .top { display: flex; flex-direction: column; }
  #viewPane { height: 52vh; flex: none; }
  .gantt-pane { height: 42vh; flex: none; }
}
</style>
</head>
<body>
<header class="bar">
  <h1><a href="./">Lazy-DaSH</a> Result</h1>
  <select id="pick" class="sel" hidden aria-label="Result in the repository" data-placeholder="Results in results/"></select>
  <button id="open" class="btn" type="button">Open file</button>
  <span class="file" id="file">No result loaded</span>
  <button id="theme" class="btn" type="button"></button>
</header>
<main class="app" id="app">
  <div class="top" id="top">
    <section class="pane" id="viewPane" aria-label="3D view">
      <div class="view3d" id="view"></div>
      <div class="overlay tl">
        <span>Arms</span>
        <span class="seg" id="model"><button type="button" data-v="mesh" aria-pressed="true">meshes</button><button type="button" data-v="spheres" aria-pressed="false">spheres</button></span>
        <span>Scenery</span>
        <span class="seg" id="scenery"><button type="button" data-v="primitives" aria-pressed="false">primitives</button><button type="button" data-v="boxes" aria-pressed="true">boxes</button><button type="button" data-v="hidden" aria-pressed="false">hidden</button></span>
      </div>
      <div class="overlay bl key" id="selnote">Click an arm or a timeline row to trace its gripper.</div>
      <div class="drop-hint" id="hint"><p>Pick a result above, or drop a <b>result JSON</b> here<br>(<code>lazydash_solve &lt;scene&gt; --out result.json</code>).</p></div>
    </section>
    <div class="gutter v" id="gv" role="separator" aria-orientation="vertical"></div>
    <aside class="pane stats" id="stats" aria-label="Solve statistics"></aside>
  </div>
  <div class="transport">
    <button id="play" class="btn icon" type="button" aria-label="Play" disabled>Play</button>
    <button id="prev" class="btn icon" type="button" aria-label="Previous event" title="Previous event ( , )" disabled>&lsaquo;</button>
    <button id="next" class="btn icon" type="button" aria-label="Next event" title="Next event ( . )" disabled>&rsaquo;</button>
    <input id="slider" type="range" min="0" max="1" step="1" value="0" aria-label="Time" disabled>
    <span id="clock">0.0 / 0.0 s</span>
    <select id="speed" class="sel" aria-label="Playback speed">
      <option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option>
      <option value="4">4x</option><option value="8">8x</option><option value="16">16x</option>
    </select>
  </div>
  <div class="gutter h" id="gh" role="separator" aria-orientation="horizontal"></div>
  <section class="pane gantt-pane" aria-labelledby="gantt-h">
    <div class="head">
      <h2 id="gantt-h">Arm timeline</h2>
      <div class="legend">
        <span><i style="background:var(--empty)"></i>moving, hand empty</span>
        <span><i style="background:var(--carry)"></i>carrying</span>
        <span><i class="tick" style="background:var(--stage)"></i>grasp or release stage</span>
        <span><i class="line" style="background:var(--stage);opacity:.45"></i>handover</span>
      </div>
    </div>
    <div id="gantt"></div>
  </section>
</main>
<script type="module" src="result.js"></script>
</body>
</html>
