<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy-DaSH Results Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="common/theme.css">
<style>
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); flex: none; }
.tabs { display: flex; gap: 2px; }
.tab { font: 500 14px var(--font-display); letter-spacing: 0.02em; color: var(--muted); background: none; border: 0;
  border-bottom: 2px solid transparent; padding: 4px 10px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .k { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.chip { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px;
  padding: 2px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--faint); }
.chip[aria-pressed="false"] { opacity: 0.55; }
.chip .sw { width: 14px; height: 0; border-top: 2px solid; }
.chip .sw.dash { border-top-style: dashed; }
#main { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 24px; }
.cols { display: grid; gap: 12px; }
.colhead { position: sticky; top: -12px; z-index: 2; background: var(--bg); padding: 6px 0 4px; }
.colhead h3, .fam h3 { font: 500 13px var(--font-body); color: var(--muted); margin: 0; }
.fam { margin-bottom: 10px; }
.fam > h3 { color: var(--ink); font: 600 14px var(--font-display); letter-spacing: 0.01em; margin: 4px 0 2px; }
.cell { min-width: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 4px 0; }
.wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.wrap .cell h3 { font: 600 13px var(--font-display); margin: 4px 6px 0; }
.note { margin: 0 0 10px; max-width: 90ch; }
.tablebox { overflow: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; max-height: 100%; }
.tablebox td.fam-l { color: var(--muted); }
.tablebox th.grp { text-align: center; border-left: 1px solid var(--rule); }
.tablebox td.first, .tablebox th.first { border-left: 1px solid var(--rule); }
.empty { color: var(--muted); max-width: 70ch; margin: 40px auto; text-align: center; }
@media (max-width: 760px) {
  .cols { grid-template-columns: minmax(0, 1fr) !important; }
  .colhead { display: none; }
  .cell[data-col]::before { content: attr(data-col); display: block; font-size: 12px; color: var(--muted); margin: 2px 6px; }
}
</style>
</head>
<body>
<header class="bar">
  <h1><a href="./">Lazy-DaSH</a> Results</h1>
  <button id="open" class="btn" type="button">Open file</button>
  <span class="file" id="file">No data loaded</span>
  <button id="theme" class="btn" type="button"></button>
</header>
<div class="controls">
  <div class="tabs" role="tablist" id="tabs" aria-label="View"></div>
  <div class="chips" id="series" aria-label="Series"></div>
  <div class="chips" id="families" aria-label="Scene families"></div>
</div>
<main id="main"></main>
<script type="module" src="results.js"></script>
</body>
</html>
